state_dir: ~/.spacedock
security:
  sensitive_paths:
    # The built-in deny list is always active. These are additive component globs.
    # additional_patterns: ["*.secret", "private*"]
    additional_patterns: []
server:
  host: 127.0.0.1
  port: 8766
  public_base_url: https://example.domain
  allowed_hosts: [example.domain, localhost, 127.0.0.1, ::1]
  trust_proxy: true
  oauth:
    owner_token_file: ~/.spacedock/oauth-owner.token
    access_token_ttl_seconds: 3600
    refresh_token_ttl_seconds: 2592000
    scopes: [spacedock]
    allowed_resource_urls: []
    allowed_redirect_hosts: [chatgpt.com, localhost, 127.0.0.1, ::1]
worktree:
  root: ~/.spacedock/worktrees
agents:
  max_concurrent: 4
  codex:
    # Primary profiles are Markdown files in ~/.spacedock/agents/*.md.
    # Workspace-local profiles live in .spacedock/agents/*.md.
    # See examples/agents/ for profile examples.
    # `codex` is resolved from PATH. Under systemd, an absolute path is safer
    # when the CLI was installed through nvm or another shell-specific PATH.
    command: codex
allowed_roots:
  - id: github
    name: GitHub Projects
    path: /home/ubuntu/github
    permissions: [fs.read, fs.write, command.execute, git.read, workspace.manage, recall.read, recall.write, acp.connect, agent.execute]
acp:
  endpoints:
    - id: copilot
      name: GitHub Copilot ACP
      command: /absolute/path/to/copilot
      args: [--acp]
      env_from: {}
  # A Markdown profile selects this endpoint with endpoint_id: copilot.
